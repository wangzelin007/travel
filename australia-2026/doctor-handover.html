<main class="supplementary-main md"><p><strong>完整家庭私密版：此入口直接显示已整理好的两页英文摘要。</strong>公开网址不存放孩子病历；在这里可选择本机的英文 PDF 查看，文件不会上传。</p>
<p><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src blob:; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"></p>
<style>
.doctor-reader { margin:16px 0; }
.doctor-reader label, .doctor-reader button, .doctor-reader a { display:inline-flex; align-items:center; min-height:44px; padding:8px 12px; }
.doctor-reader a.supplementary-button, .doctor-reader a.supplementary-button:hover { color:#fff; background:#075985; }
.doctor-reader input { display:block; width:100%; margin:8px 0; min-height:44px; font:inherit; }
.doctor-reader p { overflow-wrap:anywhere; }
.doctor-reader iframe { display:block; width:100%; height:75vh; min-height:480px; border:1px solid #cbd5e1; border-radius:8px; margin-top:12px; }
.doctor-reader [hidden] { display:none; }
.doctor-reader [role="alert"] { color:#991b1b; }
@media print { .doctor-reader { display:none; } }
</style>

<div class="doctor-reader">
  <label for="doctor-file"><strong>选择本机的英文报告 PDF</strong></label>
  <input id="doctor-file" type="file" accept=".pdf,application/pdf" aria-describedby="doctor-file-note">
  <p id="doctor-file-note">仅在当前标签页显示，不上传、不写入浏览器存储；关闭后清除。</p>
  <p id="doctor-error" role="alert" hidden></p>
  <section id="doctor-preview" hidden aria-label="英文就医报告">
    <p id="doctor-status" role="status"></p>
    <a id="doctor-open" class="supplementary-button" target="_blank" rel="noopener noreferrer">全屏打开英文 PDF</a>
    <button id="doctor-clear" type="button" class="supplementary-button">关闭报告</button>
    <iframe id="doctor-frame" title="英文就医报告 PDF" referrerpolicy="no-referrer"></iframe>
    <p>若手机未显示内嵌 PDF，点“全屏打开英文 PDF”。</p>
  </section>
</div>

<noscript>请直接用设备的 PDF 阅读器打开英文摘要；本机查看功能需要 JavaScript，不需要上传文件。</noscript>

<script>
(() => {
  const input = document.getElementById("doctor-file");
  const preview = document.getElementById("doctor-preview");
  const status = document.getElementById("doctor-status");
  const error = document.getElementById("doctor-error");
  const frame = document.getElementById("doctor-frame");
  const open = document.getElementById("doctor-open");
  let objectUrl = null;
  let selection = 0;
  function clearReport() {
    frame.removeAttribute("src");
    open.removeAttribute("href");
    preview.hidden = true;
    status.textContent = "";
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = null;
  }
  document.getElementById("doctor-clear").addEventListener("click", () => {
    selection += 1;
    clearReport();
    input.value = "";
    error.hidden = true;
  });
  input.addEventListener("change", async () => {
    const current = ++selection;
    clearReport();
    error.hidden = true;
    const file = input.files[0];
    if (!file) return;
    try {
      if (file.size > 10 * 1024 * 1024) throw new Error("请选择小于 10 MB 的英文报告 PDF。");
      if (await file.slice(0, 5).text() !== "%PDF-") throw new Error("这不是 PDF 文件，请选择英文报告的 PDF 版本。");
      if (current !== selection) return;
      objectUrl = URL.createObjectURL(new Blob([file], { type: "application/pdf" }));
      frame.src = objectUrl;
      open.href = objectUrl;
      status.textContent = `已在本机打开：${file.name}（未上传）`;
      preview.hidden = false;
    } catch (cause) {
      if (current !== selection) return;
      clearReport();
      error.textContent = cause instanceof Error ? cause.message : "无法读取文件，请重新选择本机 PDF。";
      error.hidden = false;
    }
  });
})();
</script></main>
