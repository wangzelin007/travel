<main class="supplementary-main md"><p><strong>从家庭私密入口打开后，这里直接显示两页英文就医材料，不需要选择本机文件。</strong>报告不附中文原图。</p>
<p><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self' blob:; object-src 'none'; connect-src 'self'; base-uri 'none'; form-action 'none'"></p>
<script>
(() => {
  const storageName = "australia-2026-medical-key-v1";
  const assets = Object.freeze({
    summary: "medical-private/summary.v1.bin",
    doctor: "medical-private/doctor.v1.bin",
    family: "medical-private/family.v1.bin"
  });
  function normaliseKey(value) {
    if (typeof value !== "string") throw new Error("请从家庭私密入口打开，或粘贴家庭密钥。");
    let key = value.trim();
    if (key.includes("#")) key = new URL(key).hash.slice(1);
    if (key.includes("medical-key=")) key = new URLSearchParams(key).get("medical-key") || "";
    if (!/^[A-Za-z0-9_-]{43}$/.test(key)) throw new Error("请使用完整的家庭私密链接，或粘贴正确密钥。");
    return key;
  }
  function getKey() {
    return sessionStorage.getItem(storageName);
  }
  function rememberKey(value) {
    sessionStorage.setItem(storageName, normaliseKey(value));
  }
  function forgetKey() {
    sessionStorage.removeItem(storageName);
  }
  async function decryptAsset(name, value) {
    if (!Object.hasOwn(assets, name)) throw new Error("未知的医疗资料类型。");
    if (!crypto.subtle) throw new Error("请通过 HTTPS，使用新版 Safari 或 Chrome 打开家庭入口。");
    const key = normaliseKey(value);
    const rawKey = Uint8Array.from(atob(key.replace(/-/g, "+").replace(/_/g, "/") + "="), char => char.charCodeAt(0));
    const response = await fetch(assets[name], {
      cache: "no-store",
      credentials: "omit",
      redirect: "error",
      referrerPolicy: "no-referrer",
      signal: AbortSignal.timeout(30000)
    });
    if (!response.ok) throw new Error(`资料下载失败（HTTP ${response.status}），请稍后重试。`);
    const packet = new Uint8Array(await response.arrayBuffer());
    if (packet.length < 34 || new TextDecoder().decode(packet.slice(0, 6)) !== "ATMED1") {
      throw new Error("加密资料格式不正确，未显示任何病历。");
    }
    const cryptoKey = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    try {
      return await crypto.subtle.decrypt({
        name: "AES-GCM",
        iv: packet.slice(6, 18),
        additionalData: new TextEncoder().encode(`australia-2026:${name}`),
        tagLength: 128
      }, cryptoKey, packet.slice(18));
    } catch (cause) {
      if (cause instanceof DOMException && cause.name === "OperationError") {
        throw new Error("无法解锁：密钥不匹配或资料已损坏，病历未显示。");
      }
      throw cause;
    }
  }
  function familyUrl(value) {
    const url = new URL("index.html", location.href);
    url.hash = `medical-key=${normaliseKey(value)}`;
    return url.href;
  }
  window.TripMedicalAccess = Object.freeze({ normaliseKey, getKey, rememberKey, forgetKey, decryptAsset, familyUrl });
  try {
    const fragment = new URLSearchParams(location.hash.slice(1));
    if (fragment.has("medical-key")) {
      const value = fragment.get("medical-key");
      fragment.delete("medical-key");
      history.replaceState(null, "", location.pathname + location.search + (fragment.size ? `#${fragment}` : ""));
      rememberKey(value);
    }
    if (getKey()) {
      for (const link of document.querySelectorAll("a.nav-pdf")) {
        link.href = "doctor-handover.html#family-pdf";
        link.textContent = "家庭PDF";
        link.removeAttribute("target");
        link.setAttribute("data-same-tab", "");
      }
    }
  } catch (cause) {
    const warning = document.createElement("p");
    warning.id = "medical-access-warning";
    warning.setAttribute("role", "alert");
    warning.textContent = cause instanceof Error ? cause.message : "无法读取家庭入口，请在普通浏览器标签页重试。";
    document.currentScript.before(warning);
  }
})();
</script>

  const error = document.getElementById("medical-error");
  const frame = document.getElementById("medical-frame");
  const fullScreen = document.getElementById("medical-fullscreen");
  const doctorPdf = document.getElementById("medical-doctor-pdf");
  const familyButton = document.getElementById("medical-family-pdf");
  let urls = [];
  let generation = 0;
  function showError(cause) {
    error.textContent = cause instanceof Error ? cause.message : "读取资料失败，请重试。";
    error.hidden = false;
  }
  function clearReport() {
    frame.removeAttribute("srcdoc");
    fullScreen.removeAttribute("href");
    doctorPdf.removeAttribute("href");
    report.hidden = true;
    for (const url of urls) URL.revokeObjectURL(url);
    urls = [];
  }
  async function downloadFamily() {
    const current = generation;
    familyButton.disabled = true;
    error.hidden = true;
    status.textContent = "正在解密完整家庭 PDF…";
    try {
      const bytes = await access.decryptAsset("family", access.getKey());
      if (current !== generation) return;
      const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      urls.push(url);
      const link = document.createElement("a");
      link.href = url;
      link.download = "australia-2026-family-private.pdf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      status.textContent = "完整家庭 PDF 已准备，包含全部行程及两页英文就医材料。";
    } catch (cause) {
      if (current === generation) {
        status.textContent = "";
        showError(cause);
      }
    } finally {
      familyButton.disabled = false;
    }
  }
  async function unlock(value) {
    const current = ++generation;
    clearReport();
    error.hidden = true;
    unlockButton.disabled = true;
    status.textContent = "正在解锁英文材料…";
    try {
      const key = access.normaliseKey(value);
      const [htmlBytes, pdfBytes] = await Promise.all([
        access.decryptAsset("summary", key),
        access.decryptAsset("doctor", key)
      ]);
      if (current !== generation) return;
      const html = new TextDecoder("utf-8", { fatal: true }).decode(htmlBytes);
      access.rememberKey(key);
      const htmlUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      const pdfUrl = URL.createObjectURL(new Blob([pdfBytes], { type: "application/pdf" }));
      urls.push(htmlUrl, pdfUrl);
      frame.srcdoc = html;
      fullScreen.href = htmlUrl;
      doctorPdf.href = pdfUrl;
      form.hidden = true;
      input.value = "";
      report.hidden = false;
      status.textContent = "英文材料已解锁。";
      if (location.hash === "#family-pdf") {
        history.replaceState(null, "", location.pathname + location.search);
        await downloadFamily();
      }
    } catch (cause) {
      if (current === generation) {
        clearReport();
        form.hidden = false;
        status.textContent = "";
        showError(cause);
      }
    } finally {
      unlockButton.disabled = false;
    }
  }
  unlockButton.addEventListener("click", () => unlock(input.value));
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") { event.preventDefault(); unlock(input.value); }
  });
  familyButton.addEventListener("click", downloadFamily);
  document.getElementById("medical-lock").addEventListener("click", () => {
    generation += 1;
    clearReport();
    form.hidden = false;
    input.value = "";
    status.textContent = "已锁定当前页面；已下载或另行打开的文件不会被删除。";
    error.hidden = true;
    try { access.forgetKey(); } catch (cause) { showError(cause); }
  });
  document.getElementById("medical-share").addEventListener("click", async () => {
    error.hidden = true;
    try {
      await navigator.clipboard.writeText(access.familyUrl(access.getKey()));
      status.textContent = "家庭私密链接已复制，只发给同行家人。";
    } catch (cause) {
      showError(new Error("无法复制。请改用已保存的家庭私密入口文件转发，不要复制不带密钥的普通网址。"));
    }
  });
  try {
    const key = access.getKey();
    if (key) unlock(key);
  } catch (cause) { showError(cause); }
})();
</script></main>
