<script>(() => {
  "use strict";
  const form = document.getElementById("unlock-form");
  const password = document.getElementById("page-password");
  const submit = document.getElementById("unlock");
  const status = document.getElementById("unlock-status");
  const error = document.getElementById("unlock-error");
  const reveal = document.getElementById("show-password");
  reveal.addEventListener("click", () => {
    const show = password.type === "password";
    password.type = show ? "text" : "password";
    reveal.textContent = show ? "隐藏" : "显示";
    reveal.setAttribute("aria-pressed", String(show));
    reveal.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
  });
  if (!window.crypto?.subtle) {
    error.textContent = "此浏览器无法安全解锁。请通过 HTTPS 正式网址使用新版 Safari、Chrome 或 Edge。";
    error.hidden = false;
    submit.disabled = true;
    return;
  }
  let busy = false;
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (busy || !form.reportValidity()) return;
    busy = true;
    submit.disabled = true;
    password.readOnly = true;
    status.textContent = "正在解锁…";
    error.hidden = true;
    password.removeAttribute("aria-invalid");
    try {
      const packet = JSON.parse(document.getElementById("protected-page-data").textContent);
      if (packet.version !== 1 || packet.iterations !== 600000) {
        throw new Error("不支持的页面版本，请刷新正式网址后重试。");
      }
      const decode = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
      const salt = decode(packet.salt), iv = decode(packet.iv);
      if (salt.length !== 16 || iv.length !== 12) throw new Error("页面数据损坏，请刷新后重试。");
      const encoder = new TextEncoder();
      const material = await crypto.subtle.importKey(
        "raw", encoder.encode(password.value), "PBKDF2", false, ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", iterations: packet.iterations, salt },
        material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv, additionalData: encoder.encode(packet.aad) },
        key, decode(packet.ciphertext)
      );
      const contents = new TextDecoder("utf-8", { fatal: true }).decode(plaintext);
      password.value = "";
      document.open();
      document.write(contents);
      document.close();
      document.getElementById("page-lock")?.focus();
    } catch (cause) {
      status.textContent = "";
      error.textContent = cause?.name === "OperationError"
        ? "密码不正确，或页面数据已损坏。请重新输入；仍失败时刷新正式网址。"
        : `无法解锁：${cause instanceof Error ? cause.message : "请刷新后重试。"}`;
      error.hidden = false;
      password.setAttribute("aria-invalid", "true");
      password.readOnly = false;
      password.focus();
      password.select();
    } finally {
      busy = false;
      submit.disabled = false;
      password.readOnly = false;
    }
  });
})();
</script>
